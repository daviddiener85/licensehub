name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: license_hub
          POSTGRES_PASSWORD: license_hub
          POSTGRES_DB: license_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U license_hub -d license_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://license_hub:license_hub@localhost:5432/license_hub?schema=public
      APP_BASE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      REGRESSION_APPLICATION_ID: LH-2026-0018
      ADMIN_ACCESS_KEY: ci-admin
      SUPPLIER_ACCESS_KEY: ci-supplier
      PAYSTACK_PUBLIC_KEY: ""
      PAYSTACK_SECRET_KEY: ""
      PAYSTACK_WEBHOOK_SECRET: ""
      WHATSAPP_PROVIDER: meta_cloud_api
      WHATSAPP_ACCESS_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_API_VERSION: v23.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ""
      WHATSAPP_APP_SECRET: ""
      WHATSAPP_WEBHOOK_SECRET: ""
      OPENAI_API_KEY: ""
      CLIENT_ID_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run lint
        run: npm run lint

      - name: Run Paystack confirmation regressions
        run: npm run test:paystack

      - name: Run Paystack PostgreSQL regressions
        run: npm run test:paystack-db
        env:
          PAYSTACK_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run production build
        run: npm run build

      - name: Start application
        run: npm run start > /tmp/license-hub.log 2>&1 &

      - name: Run UI regression suite
        run: npm run test:regression

      - name: Show app logs on failure
        if: failure()
        run: tail -n 200 /tmp/license-hub.log
